[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Single-page app: all routes must return index.html so React Router can run
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
