[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_TO"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Single-page app: all routes must return index.html so React Router can run
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
